[package]
name = "weavatrix-edit"
version = "0.1.5"
edition = "2024"
rust-version = "1.88"
description = "Deterministic, Unicode-safe edit-plan validation and application for source refactoring"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/weavatrix-edit"
documentation = "https://docs.rs/weavatrix-edit"
readme = "README.md"
publish = ["crates-io"]
keywords = ["refactoring", "unicode", "text-edit", "source-code", "weavatrix"]
categories = ["development-tools", "text-processing"]
exclude = ["tools/**", "benchmark-results/**"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
blazingly-json = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# Second serde driver used only by the envelope wire-equivalence tests.
serde_json = "1.0"

[[bench]]
name = "edit_engine"
harness = false

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
