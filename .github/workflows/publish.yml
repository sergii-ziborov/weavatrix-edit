name: Publish crate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # 2026-07-29
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Resolve crate version
        id: crate
        shell: bash
        run: |
          crate_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "${crate_version}"
          echo "version=${crate_version}" >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - run: cargo package --locked
      - name: Check whether this immutable version already exists
        id: registry
        shell: bash
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          api="https://crates.io/api/v1/crates/weavatrix-edit/${CRATE_VERSION}"
          if curl --fail --silent --show-error \
            --header "User-Agent: weavatrix-edit-release/${CRATE_VERSION}" \
            "${api}" > /dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish to crates.io
        if: steps.registry.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Verify the public archive matches the checked package
        shell: bash
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          download="https://crates.io/api/v1/crates/weavatrix-edit/${CRATE_VERSION}/download"
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error \
              --header "User-Agent: weavatrix-edit-release/${CRATE_VERSION}" \
              "${download}" --output registry.crate; then
              break
            fi
            sleep 5
          done
          test -s registry.crate
          cmp "target/package/weavatrix-edit-${CRATE_VERSION}.crate" registry.crate
          sha256sum "target/package/weavatrix-edit-${CRATE_VERSION}.crate" registry.crate
